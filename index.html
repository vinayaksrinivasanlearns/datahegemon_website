

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Apartment Management System by DataHegemon — maintenance dues, receipts and reminders for housing societies, on WhatsApp" />
    <title>Apartment Management System — DataHegemon</title>
  </head>

  <body>
    <!-- For Netlify Forms: Netlify reads this at deploy time (the real form is drawn by React).
         Keep the name and fields in sync with the contact form in src/App.jsx. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="society" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

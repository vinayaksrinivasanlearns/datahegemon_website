<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resident Steps</title>
<style>
  :root {
    --page: #f0f2f5; --ink: #111b21; --muted: #667781; --accent: #008069;
    --wa-head: #008069; --wa-bg: #efeae2; --wa-in: #ffffff; --wa-out: #d9fdd3;
    --wa-btn: #027eb5; --wa-tick: #53bdeb; --wa-chip: #ffffff; --card: #ffffff;
    --doc: #f5f6f6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink);
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif; }

  /* ---- slides ---- */
  .deck { height: 100%; }
  .slide { display: none; height: 100vh; padding: 3vh 5vw; align-items: center;
    justify-content: center; gap: 5vw; }
  .slide.on { display: flex; }
  .copy { max-width: 520px; }
  .copy .step { color: var(--accent); font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; font-size: 15px; }
  .copy h1 { font-size: clamp(26px, 3.4vw, 44px); line-height: 1.15; margin: 8px 0 16px; }
  .copy ul { padding-left: 20px; margin: 0; font-size: clamp(15px, 1.35vw, 19px); line-height: 1.55; }
  .copy li { margin: 6px 0; }
  .copy .tag { display: inline-block; background: #e7f6f2; color: var(--accent); border-radius: 999px;
    padding: 4px 12px; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .title-slide { flex-direction: column; text-align: center; }
  .title-slide h1 { font-size: clamp(32px, 5vw, 64px); margin: 12px 0; }
  .title-slide p { font-size: clamp(16px, 1.8vw, 24px); color: var(--muted); margin: 6px 0; }
  .logo { width: 96px; height: 96px; border-radius: 50%; background: var(--wa-head); color: #fff;
    display: grid; place-items: center; font-size: 48px; margin: 0 auto; }

  .nav { position: fixed; bottom: 14px; right: 18px; display: flex; gap: 8px; align-items: center;
    font-size: 14px; color: var(--muted); }
  .nav button { border: 0; background: var(--card); color: var(--ink); width: 38px; height: 38px;
    border-radius: 50%; font-size: 18px; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.15); }

  /* ---- phone ---- */
  .phone { height: min(90vh, 780px); aspect-ratio: 9 / 19; background: #1f2c33; border-radius: 38px;
    padding: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.25); flex: none; }
  .screen { height: 100%; border-radius: 30px; overflow: hidden; display: flex;
    flex-direction: column; background: var(--wa-bg); position: relative; }
  .status { background: var(--wa-head); color: #fff; font-size: 12px; padding: 6px 18px 2px;
    display: flex; justify-content: space-between; }
  .head { background: var(--wa-head); color: #fff; display: flex; align-items: center; gap: 10px;
    padding: 6px 10px 10px; }
  .head .back { font-size: 20px; opacity: .9; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: #d9fdd3; color: var(--wa-head);
    display: grid; place-items: center; font-size: 19px; flex: none; }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; }
  .who span { font-size: 12px; opacity: .85; }
  .icons { display: flex; gap: 16px; opacity: .95; }
  .icons svg { width: 20px; height: 20px; fill: #fff; }

  .chat { flex: 1; overflow: hidden; padding: 8px 10px 6px; display: flex; flex-direction: column;
    justify-content: flex-end; gap: 4px;
    background-color: var(--wa-bg);
    background-image: radial-gradient(rgba(0,0,0,.035) 1px, transparent 1.4px);
    background-size: 18px 18px; }
  .chip { align-self: center; background: var(--wa-chip); color: var(--muted); font-size: 12px;
    padding: 4px 10px; border-radius: 7px; margin: 6px 0; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
  .row { display: flex; flex-direction: column; max-width: 86%; }
  .row.me { align-self: flex-end; align-items: flex-end; }
  .row.bot { align-self: flex-start; }
  .bubble { background: var(--wa-in); border-radius: 8px; padding: 6px 8px 4px 9px; font-size: 14.2px;
    line-height: 1.38; box-shadow: 0 1px .5px rgba(11,20,26,.13); position: relative;
    word-wrap: break-word; }
  .me .bubble { background: var(--wa-out); }
  .bot .bubble.tail { border-top-left-radius: 0; }
  .me .bubble.tail { border-top-right-radius: 0; }
  .bot .bubble.tail::before, .me .bubble.tail::before { content: ""; position: absolute; top: 0;
    width: 8px; height: 13px; }
  .bot .bubble.tail::before { left: -8px; background: linear-gradient(225deg, var(--wa-in) 50%, transparent 50%); }
  .me .bubble.tail::before { right: -8px; background: linear-gradient(135deg, var(--wa-out) 50%, transparent 50%); }
  .meta { float: right; font-size: 11px; color: var(--muted); margin: 6px 0 -2px 10px; white-space: nowrap; }
  .meta .ticks { color: var(--wa-tick); margin-left: 2px; letter-spacing: -3px; }
  .btns { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; width: 100%; }
  .btns div { background: var(--wa-in); color: var(--wa-btn); text-align: center; font-size: 14px;
    padding: 9px 8px; border-radius: 8px; box-shadow: 0 1px .5px rgba(11,20,26,.13); font-weight: 500; }
  .listbtn { border-top: 1px solid #e9edef; margin: 6px -8px -4px -9px; padding: 9px; text-align: center;
    color: var(--wa-btn); font-weight: 500; font-size: 14px; }
  .doc { background: var(--doc); border-radius: 6px; display: flex; gap: 10px; align-items: center;
    padding: 10px; margin: 2px -4px 4px -5px; }
  .me .doc { background: #c6efc0; }
  .pdf { width: 30px; height: 36px; background: #e2493c; color: #fff; font-size: 9px; font-weight: 700;
    border-radius: 3px; display: grid; place-items: end center; padding-bottom: 4px; flex: none; }
  .doc b { display: block; font-size: 13.5px; font-weight: 500; }
  .doc span { font-size: 11.5px; color: var(--muted); }
  .shot { width: 190px; border-radius: 6px; overflow: hidden; margin: 1px -5px 4px -6px;
    background: #fff; border: 1px solid #e0e0e0; font-size: 11px; text-align: center; }
  .shot .top { background: #1a73e8; color: #fff; padding: 14px 6px 10px; }
  .shot .ok { width: 38px; height: 38px; border-radius: 50%; background: #fff; color: #1a73e8;
    display: grid; place-items: center; margin: 0 auto 6px; font-size: 22px; font-weight: 700; }
  .shot .amt { font-size: 22px; font-weight: 700; }
  .shot .lines { padding: 8px 10px; text-align: left; color: #444; line-height: 1.6; }
  .selfie { width: 150px; height: 170px; border-radius: 6px; margin: 1px -5px 4px -6px;
    background: linear-gradient(160deg, #cfd8dc, #90a4ae); display: grid; place-items: center;
    font-size: 64px; }
  .typing { display: flex; gap: 4px; padding: 6px 4px 4px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: #8696a0; display: block;
    animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .35; } 30% { opacity: 1; } }
  body.render .nav { display: none; }
  .tapped { background: #d7efe8 !important; }
  .opt.tapped .radio { border-color: #00a884; background: radial-gradient(#00a884 45%, transparent 50%); }
  .finger { position: absolute; width: 46px; height: 46px; border-radius: 50%; pointer-events: none;
    background: rgba(17,27,33,.22); border: 3px solid rgba(255,255,255,.95);
    box-shadow: 0 0 0 9px rgba(0,128,105,.28); transform: translate(-50%, -50%); z-index: 5; }
  .finger::after { content: "👆"; position: absolute; left: 14px; top: 26px; font-size: 30px; }
  body.render .slide { gap: 6vw; padding: 2vh 5vw; }
  body.render .phone { height: 95vh; }
  body.render .copy { max-width: 820px; }
  body.render .copy .step { font-size: 22px; }
  body.render .copy h1 { font-size: 62px; }
  body.render .copy ul { font-size: 28px; }
  body.render .copy li { margin: 12px 0; }
  body.render .title-slide h1 { font-size: 84px; }
  body.render .title-slide p { font-size: 32px; }
  body.render .logo { width: 140px; height: 140px; font-size: 72px; }
  .tpl-head { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; }

  .inputbar { display: flex; align-items: center; gap: 6px; padding: 6px 6px 10px; }
  .field { flex: 1; background: #fff; border-radius: 24px; padding: 10px 14px; color: #8696a0;
    font-size: 15px; display: flex; gap: 10px; align-items: center; }
  .field .typed { color: var(--ink); }
  .mic { width: 44px; height: 44px; border-radius: 50%; background: #00a884; display: grid;
    place-items: center; color: #fff; font-size: 18px; flex: none; }

  .sheet { position: absolute; inset: auto 0 0 0; background: #fff; border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 20px rgba(0,0,0,.2); padding: 8px 0 14px; }
  .sheet::before { content: ""; display: block; width: 36px; height: 4px; background: #d1d7db;
    border-radius: 2px; margin: 0 auto 8px; }
  .sheet h4 { margin: 4px 16px 8px; font-size: 16px; font-weight: 600; }
  .sheet .opt { display: flex; align-items: center; gap: 12px; padding: 9px 16px; }
  .sheet .opt div { flex: 1; }
  .sheet .opt b { display: block; font-size: 14.5px; font-weight: 500; }
  .sheet .opt span { font-size: 12.5px; color: var(--muted); }
  .sheet .radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #8696a0; flex: none; }
  .shade { position: absolute; inset: 0; background: rgba(11,20,26,.35); }

  .payapp { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #fff; gap: 10px; text-align: center; padding: 20px; }
  .payapp .ok { width: 84px; height: 84px; border-radius: 50%; background: #1e8e3e; color: #fff;
    display: grid; place-items: center; font-size: 44px; }
  .payapp .amt { font-size: 34px; font-weight: 700; }
  .payapp .muted { color: var(--muted); font-size: 14px; line-height: 1.6; }

  @media (max-width: 860px) {
    .slide.on { flex-direction: column; justify-content: flex-start; gap: 18px; overflow: auto;
      height: auto; min-height: 100vh; padding: 20px 16px 70px; }
    .copy { width: 100%; }
    .phone { width: 300px; max-width: 100%; height: 620px; aspect-ratio: auto; }  /* never wider than the screen; old messages scroll off the top like WhatsApp */
    .screen, .chat, .row { min-width: 0; }
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="nav"><button id="prev" aria-label="Previous slide">‹</button><span id="count"></span>
  <button id="next" aria-label="Next slide">›</button></div>

<script>
// Test association and test resident (not real people)
const SOC = "Green Valley Apartments", CODE = "GREENVALLEY", NAME = "Ravi Kumar", FLAT = "A-102";
const BOT = "Apartment Management System";
const DUES = `🏠 *${SOC}*\n\n*${FLAT} · Oct-2026*\nThis month: ₹3,100\nPaid so far: ₹0\n💰 *Balance due: ₹3,100*`;
const MENU = ["💸 I've paid", "🧾 Receipts", "🆘 Support"];
const HOME = `👋 Hi *Ravi*!\n\n🏢 *${SOC}*\n🏠 Flat ${FLAT} · Oct-2026\n💰 Balance due: *₹3,100*\n\nTap a button below. Problem with the app? Send *SUPPORT*.`;
const PROOF = "💸 Send your payment proof here, any way you like:\n📸 a screenshot of the payment\n📄 the receipt as a PDF or Word file\n✍️ or just type the reference / UTR / transaction ID";

const P = new URLSearchParams(location.search), RENDER = P.has("render");
const SLIDES = window.SLIDES = [
  { title: true },
  { step: "Step 1 · Join (number already on the list)", h: "Join your society",
    bullets: ["Scan the Resident QR code on the notice board, or tap the join link in the society group.",
              `WhatsApp opens with <b>JOIN ${CODE}</b> ready. Tap Send.`,
              "You're linked to your flat straight away and see your dues."],
    chat: [{ chip: "Today" },
      { me: `JOIN ${CODE}`, t: "10:02" },
      { bot: `🎉 Welcome ${NAME}! You're linked to ${FLAT} at *${SOC}*.\n\n${DUES}\n\nHere you can check your dues, send payment proof and download receipts.`, t: "10:02", buttons: MENU }] },
  { step: "Step 1 · Join (number not on the list yet)", h: "New number? Register with your name and flat",
    bullets: ["The bot asks your name, then your flat number.",
              "The society admin approves you as owner or tenant.",
              "You get a message once you're registered."],
    chat: [{ me: `JOIN ${CODE}`, t: "10:02" },
      { bot: `👋 Welcome to *${SOC}*! Let's get you registered.\nWhat is your name?`, t: "10:02" },
      { me: NAME, t: "10:02" },
      { bot: "Which flat do you live in? Type the flat number, e.g. A-101.", t: "10:02" },
      { me: FLAT, t: "10:03" },
      { bot: `✅ Thanks ${NAME}! Your request for flat ${FLAT} has been sent to the society admin. I'll message you once it's approved.`, t: "10:03" },
      { bot: `✅ Approved! You're registered for this flat at *${SOC}*:\n• *${FLAT}* · Tenant\n\n${DUES}\n\nSend MENU any time to see your balance and options.`, t: "10:20" }] },
  { step: "Step 2", h: "See your balance",
    bullets: ["Send <b>hi</b> (or MENU) any time.", "You see each flat, the month and the balance due.",
              "Three buttons: 💸 I've paid · 🧾 Receipts · 🆘 Support."],
    chat: [{ chip: "Today" }, { me: "hi", t: "09:15" }, { bot: HOME, t: "09:15", buttons: MENU }] },
  { step: "Step 3", h: "Pay the way your association asks",
    bullets: ["UPI, bank transfer, etc. The bot doesn't take payments.",
              "Keep the payment screenshot or the UTR / reference number."],
    pay: true },
  { step: "Step 4", h: "Tell the association you've paid",
    bullets: ["Tap 💸 I've paid.", "Send a screenshot, a PDF / Word receipt, or type the UTR / reference number.",
              "Add a note for the association, or tap No note.",
              "Shortcut: just send the screenshot into the chat."],
    chat: [{ chip: "Today" }, { bot: HOME, t: "09:15", buttons: MENU, pre: true },
      { tap: "💸 I've paid" }, { me: "💸 I've paid", t: "09:16" }, { bot: PROOF, t: "09:16" },
      { me: "", shot: true, t: "09:17" },
      { bot: `📥 Got your payment proof for flat ${FLAT}. Reading it now…\n\nAdd a note for the association? e.g. "Sept and Oct maintenance". Type it, or tap No note.`, t: "09:17", buttons: ["No note"] },
      { me: "Oct maintenance", t: "09:17" }, { bot: "📝 Note saved for the association.", t: "09:17" },
      { bot: `✅ Saved your payment proof for flat ${FLAT}. It will be matched when the society checks the bank statement.`, t: "09:18" }] },
  { step: "Step 5", h: "Get your receipt",
    bullets: ["Once the association records your payment, the receipt PDF comes on WhatsApp by itself.",
              "Haven't messaged the bot in 24 hours? You first get a short notice: tap <b>View</b>."],
    chat: [{ chip: "Today" },
      { bot: `[${SOC}] You have a new receipt for flat ${FLAT}. Tap View to see it.`, t: "18:40", buttons: ["View"] },
      { tap: "View" }, { me: "View", t: "18:41" },
      { bot: `🧾 Receipt GV/2026/10/0001 · ${SOC}\nThank you for your payment!`, t: "18:41", doc: "GV-2026-10-0001.pdf" }] },
  { step: "Step 6", h: "Download old receipts",
    bullets: ["Tap 🧾 Receipts, or send RECEIPT.", "You see receipts from the last 3 months. Tap one to download it.",
              "Tap ➕ More for the last 12 months."],
    chat: [{ chip: "Today" }, { bot: HOME, t: "11:04", buttons: MENU, pre: true },
      { tap: "🧾 Receipts" }, { me: "🧾 Receipts", t: "11:05" },
      { bot: "🧾 Your receipts of the last 3 months. Tap one to download it.", t: "11:05", list: "Receipts" },
      { tap: "☰ Receipts" }, { sheet: "open" }, { tap: "GV/2026/10/0001" }, { sheet: "close" },
      { me: "GV/2026/10/0001", t: "11:05" },
      { bot: "Receipt GV/2026/10/0001", t: "11:05", doc: "GV-2026-10-0001.pdf" }],
    sheet: { title: "Receipts", rows: [
      ["GV/2026/10/0001", `${FLAT} · Oct-2026 · ₹3,100`], ["GV/2026/09/0004", `${FLAT} · Sep-2026 · ₹3,100`],
      ["GV/2026/08/0002", `${FLAT} · Aug-2026 · ₹3,100`], ["➕ More", "Receipts of the last 12 months"]] } },
  { step: "Step 7", h: "Need help? Tap Support",
    bullets: ["Tap 🆘 Support, or send SUPPORT.", "Type the problem, or send a screenshot.",
              "It goes straight to the support team, and you get a ticket number.",
              "Tip: add text as the screenshot's caption, so it's one report."],
    chat: [{ chip: "Today" }, { bot: HOME, t: "12:29", buttons: MENU, pre: true },
      { tap: "🆘 Support" }, { me: "🆘 Support", t: "12:30" },
      { bot: "🆘 *Support*\n\nTell us what's not working: type it, or send a screenshot or file. It goes straight to the support team.", t: "12:30", buttons: ["Cancel"] },
      { me: "September receipt not received", t: "12:31" },
      { bot: "✅ Sent to the support team. Your ticket number is *S-0001*. We'll get back to you here on WhatsApp.", t: "12:31" }] },
  { step: "Quick extra", h: "If your payment doesn't match",
    bullets: ["The association couldn't find your payment in the bank statement.",
              "Reply with the correct UTR / reference number (or a clearer screenshot), or contact the association."],
    chat: [{ chip: "Today" },
      { bot: `❗ *Payment proof · Flat ${FLAT}*\nWe could not match your payment (the screenshot you sent on 14-10-2026) with our bank records. Please send the details again correctly, or contact the association.`, t: "16:05" },
      { me: "628120183564", t: "16:12" },
      { bot: `✅ Saved reference 628120183564 for flat ${FLAT}. It will be matched when the society checks the bank statement.

Add a note for the association? e.g. "Sept and Oct maintenance". Type it, or tap No note.`, t: "16:12", buttons: ["No note"] }] },
  { step: "Quick extra", h: "Reminders if you still owe",
    bullets: ["👋 A short reminder: pay, or send your proof if you already paid.",
              "🔔 A payment reminder PDF, for dues a month or more overdue."],
    chat: [{ chip: "Today" },
      { bot: `👋 *Maintenance reminder · ${SOC}*\n\nHello Ravi,\nFlat *${FLAT}* · Oct-2026 maintenance *₹3,100* is not marked as paid yet.\n\n✅ *Already paid?*\n${PROOF}\n\n⏳ *Not paid yet?* Please pay ₹3,100, then send the proof here.`, t: "10:00", buttons: ["💸 I've paid", "🧾 Receipts"] },
      { bot: `🔔 *Payment reminder · ${SOC}*\n\n🏠 ${FLAT} · Sep-2026: *₹3,100 due*\n\nAlready paid? Please ignore this, or send the payment screenshot here. Send *MENU* to see your balance.`, t: "10:00", doc: `Payment-reminder-${FLAT}.pdf` }] },
  { step: "Quick extra", h: "Not sure what to send? Send HELP",
    bullets: ["Send <b>HELP</b> to see the words you can send.",
              "Send <b>MENU</b> any time to see your balance and start again."],
    chat: [{ me: "help", t: "14:00" },
      { bot: `*Here's what you can send me:*\n\n📸 A payment screenshot or PDF – after you pay\n🧾 *RECEIPT* – download your receipts\n🏠 *MENU* – your balance and the main menu\n🔗 *JOIN <code>* – link your number to your society\n\nSomething not working in the app? Tap *Support*.`, t: "14:00", buttons: ["🆘 Support", "Menu"] }] },
  { end: true },
];

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function fmt(s) {  // WhatsApp formatting: *bold*, _italic_, new lines
  return esc(s).replace(/\*([^*\n]+)\*/g, "<b>$1</b>").replace(/(^|\s)_([^_\n]+)_/g, "$1<i>$2</i>")
    .replace(/\n/g, "<br>");
}
const ICONS = `<div class="icons"><svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11z"/></svg><svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1 11.4 11.4 0 0 0 .57 3.6 1 1 0 0 1-.25 1z"/></svg><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></div>`;

function message(m, prev, tap) {
  if (m.chip) return `<div class="chip">${m.chip}</div>`;
  if (m.typing) return `<div class="row bot"><div class="bubble tail"><div class="typing"><i></i><i></i><i></i></div></div></div>`;
  const me = "me" in m, side = me ? "me" : "bot";
  const tail = !prev || prev.chip || ("me" in prev) !== me ? " tail" : "";
  const ticks = me ? `<span class="ticks">✓✓</span>` : "";
  let inner = "";
  if (m.shot) inner += `<div class="shot"><div class="top"><div class="ok">✓</div><div class="amt">₹3,100</div>Payment successful</div><div class="lines">To: ${SOC}<br>UPI Ref No: 624407160066<br>08 Oct 2026, 7:42 pm</div></div>`;
  if (m.selfie) inner += `<div class="selfie">🙂</div>`;
  if (m.doc) inner += `<div class="doc"><div class="pdf">PDF</div><div><b>${esc(m.doc)}</b><span>1 page · PDF · 48 kB</span></div></div>`;
  const text = me ? m.me : m.bot;
  inner += `${text ? fmt(text) : ""}<span class="meta">${m.t}${ticks}</span>`;
  if (m.list) inner += `<div class="listbtn${tap === "☰ " + m.list ? " tapped" : ""}">☰ ${esc(m.list)}</div>`;
  const buttons = m.buttons ? `<div class="btns">${m.buttons.map(b => `<div${b === tap ? ' class="tapped"' : ""}>${esc(b)}</div>`).join("")}</div>` : "";
  return `<div class="row ${side}"><div class="bubble${tail}">${inner}</div>${buttons}</div>`;
}

function phone(s) {
  const head = `<div class="status"><span>9:41</span><span>▂▄▆ ● 87%</span></div>
    <div class="head"><span class="back">←</span><div class="avatar">🏢</div>
      <div class="who"><b>${BOT}</b><span>Business account</span></div>${ICONS}</div>`;
  if (s.pay) {
    return `<div class="phone"><div class="screen"><div class="status" style="background:#fff;color:#111">
      <span>9:41</span><span>▂▄▆ ● 87%</span></div><div class="payapp"><div class="ok">✓</div>
      <div class="amt">₹3,100</div><b>Payment successful</b><div class="muted">To ${SOC}<br>
      UPI Ref No: 624407160066<br>08 Oct 2026, 7:42 pm</div></div></div></div>`;
  }
  const items = RENDER && P.has("upto") ? s.chat.slice(0, Number(P.get("upto"))) : s.chat;
  const last = items[items.length - 1];
  const tap = RENDER && last && last.tap ? last.tap : null;
  const open = items.reduce((on, m) => m.sheet ? m.sheet === "open" : on, false);
  let chat = items.filter(m => !m.tap && !m.sheet);
  if (RENDER && P.get("typing") === "1") chat = chat.concat([{ typing: true }]);
  const msgs = chat.map((m, i) => message(m, chat[i - 1], i === chat.length - 1 && !open ? tap : null)).join("");
  const sheet = s.sheet && open ? `<div class="shade"></div><div class="sheet"><h4>${esc(s.sheet.title)}</h4>${
    s.sheet.rows.map(([a, b]) => `<div class="opt${a === tap ? " tapped" : ""}"><div><b>${esc(a)}</b><span>${esc(b)}</span></div><span class="radio"></span></div>`).join("")}</div>` : "";
  return `<div class="phone"><div class="screen">${head}<div class="chat">${msgs}</div>
    <div class="inputbar"><div class="field">🙂 <span>Message</span><span style="margin-left:auto">📎 📷</span></div>
    <div class="mic">🎤</div></div>${sheet}</div></div>`;
}

function slide(s) {
  if (s.title) return `<section class="slide title-slide"><div class="logo">🏢</div>
    <h1>Maintenance dues on WhatsApp</h1><p>A guide for residents of ${SOC}</p>
    <p>Check your balance · tell us you've paid · get receipts · ask for help</p></section>`;
  if (s.end) return `<section class="slide title-slide"><div class="logo">✅</div>
    <h1>That's it!</h1><p>Send <b>hi</b> to the society's WhatsApp number any time.</p>
    <p>Problem with the app? Tap 🆘 Support.</p></section>`;
  return `<section class="slide"><div class="copy"><div class="step">${s.step}</div><h1>${s.h}</h1>
    <ul>${s.bullets.map(b => `<li>${b}</li>`).join("")}</ul></div>${phone(s)}</section>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = SLIDES.map(slide).join("");
const all = [...deck.children];
let at = 0;
if (RENDER) { document.body.classList.add("render"); at = Number(P.get("slide")) || 0; }
else try { at = Math.min(Number(localStorage.getItem("resident-slide")) || 0, all.length - 1); } catch (e) {}
function show(i) {
  at = Math.max(0, Math.min(all.length - 1, i));
  all.forEach((el, n) => el.classList.toggle("on", n === at));
  all[at].querySelectorAll(".tapped").forEach(el => {
    const screen = el.closest(".screen"), a = el.getBoundingClientRect(), b = screen.getBoundingClientRect();
    const f = document.createElement("div");
    f.className = "finger";
    f.style.left = `${a.left - b.left + a.width * 0.78}px`;  // beside the text, not over it
    f.style.top = `${a.top - b.top + a.height / 2}px`;
    screen.appendChild(f);
  });
  document.getElementById("count").textContent = `${at + 1} / ${all.length}`;
  if (!RENDER) try { localStorage.setItem("resident-slide", at); } catch (e) {}
}
document.getElementById("prev").onclick = () => show(at - 1);
document.getElementById("next").onclick = () => show(at + 1);
document.addEventListener("keydown", e => {
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(at + 1); }
  if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); show(at - 1); }
  if (e.key === "Home") show(0);
  if (e.key === "End") show(all.length - 1);
});
show(at);
</script>
</body>
</html>
